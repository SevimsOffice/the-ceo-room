# Build, test and publish the Desk to GitHub Pages: https://sevimsoffice.github.io/the-ceo-room/
name: Pages

on:
  push:
    # Deploy after every push to main and to the working branch: claude/sharp-albattani-b3jp4r is
    # currently the repository's default branch, and the owner wants the site updated on each push.
    branches: [main, claude/sharp-albattani-b3jp4r]
  workflow_dispatch:

# Least privilege: the build only reads the repository; only the deploy job may publish to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @ceo-room/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium for the e2e journey
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ceo-room/web exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ceo-room/web exec playwright install-deps chromium
      - name: E2E (Playwright, built site)
        run: pnpm --filter @ceo-room/web exec playwright test --trace off
        env:
          CI: 'true'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # needs pages: write, so it runs here rather than in the read-only build job
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v5
